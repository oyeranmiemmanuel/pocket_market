
<span class="inline-flex items-center gap-0.5 text-yellow-400"
      aria-label="Product rating">

    {% if rating >= 1 %}
        <i class="fa-solid fa-star text-xs"></i>
    {% else %}
        <i class="fa-regular fa-star text-xs"></i>
    {% endif %}

    {% if rating >= 2 %}
        <i class="fa-solid fa-star text-xs"></i>
    {% else %}
        <i class="fa-regular fa-star text-xs"></i>
    {% endif %}

    {% if rating >= 3 %}
        <i class="fa-solid fa-star text-xs"></i>
    {% else %}
        <i class="fa-regular fa-star text-xs"></i>
    {% endif %}

    {% if rating >= 4 %}
        <i class="fa-solid fa-star text-xs"></i>
    {% else %}
        <i class="fa-regular fa-star text-xs"></i>
    {% endif %}

    {% if rating >= 5 %}
        <i class="fa-solid fa-star text-xs"></i>
    {% else %}
        <i class="fa-regular fa-star text-xs"></i>
    {% endif %}

</span>
