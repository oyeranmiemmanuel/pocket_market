{% extends 'core/base.html' %}
{% block title %}Bank Details | Top Tech{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Bank Details</h1>
    <form method="post" class="bg-white rounded-xl shadow p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bank Name</label>
            {{ form.bank_name.errors }}
            <input type="text" name="bank_name" value="{{ form.bank_name.value|default:'' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account Number</label>
            {{ form.bank_account_number.errors }}
            <input type="text" name="bank_account_number" value="{{ form.bank_account_number.value|default:'' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account Name</label>
            {{ form.bank_account_name.errors }}
            <input type="text" name="bank_account_name" value="{{ form.bank_account_name.value|default:'' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
            Save
        </button>
    </form>
</div>
{% endblock %}
