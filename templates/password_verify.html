<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Password</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 40px; max-width: 380px; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 22px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .errorlist { color: #e74c3c; font-size: 13px; margin-top: 4px; list-style: none; padding: 0; }
        .messages p { padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .messages .success { background: #d4edda; color: #155724; }
        .messages .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="card">
    <h1>Confirm Your Password</h1>
    <p>For your security, please re-enter your password to continue.</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.password.errors }}
        {{ form.password }}
        <button type="submit">Verify</button>
    </form>
</div>
</body>
</html>
