{% extends 'core/base.html' %}

{% block title %}Rider Bank Details | Top Tech{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Bank Details</h1>

    <div class="bg-white rounded-xl shadow p-6 sm:p-8">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
                Save
            </button>
        </form>
    </div>
</div>
{% endblock %}
