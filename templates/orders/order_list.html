<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 40px; }
        .wrap { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #eee; }
        th { color: #888; font-size: 13px; text-transform: uppercase; }
        a { color: #4f46e5; text-decoration: none; }
        .status { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status.paid, .status.delivered, .status.shipped { background: #d4edda; color: #155724; }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.failed, .status.cancelled { background: #f8d7da; color: #721c24; }
        .empty { text-align: center; color: #888; padding: 40px 0; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>My Orders</h1>
    {% if orders %}
        <table>
            <thead>
                <tr><th>Reference</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.reference }}</td>
                    <td>{{ order.created_at|date:"M d, Y" }}</td>
                    <td><span class="status {{ order.status }}">{{ order.get_status_display }}</span></td>
                    <td>₦{{ order.total }}</td>
                    <td><a href="{% url 'orders:order_detail' order.reference %}">View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="empty">You haven't placed any orders yet.</p>
    {% endif %}
</div>
</body>
</html>
