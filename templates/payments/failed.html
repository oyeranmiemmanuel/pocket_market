{% extends 'core/base.html' %}

{% block title %}Payment Failed | Top Tech{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white rounded-xl shadow p-10 text-center">
        <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-xmark text-3xl text-red-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment Failed</h1>
        <p class="text-gray-500">We couldn't confirm payment for order <span class="font-semibold text-gray-800">{{ order.reference }}</span>.</p>
        <p class="text-gray-500 mt-1">Please try again or contact support if you were charged.</p>
        <a href="{% url 'orders:order_detail' order.reference %}"
           class="inline-block mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition">
            Back to order
        </a>
    </div>
</div>
{% endblock %}
