{% extends 'core/base.html' %}

{% block title %}Delete Product | Top Tech{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white rounded-xl shadow p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-trash text-2xl text-red-500"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Delete "{{ product.name }}"?</h1>
        <p class="text-gray-500 mb-6">This removes it from your store. Existing orders that include it are kept.</p>

        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <a href="{% url 'sellers:product_list' %}"
               class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-600 border border-gray-300 hover:bg-gray-50 transition">
                Cancel
            </a>
            <button type="submit"
                    class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-red-600 hover:bg-red-700 text-white transition">
                Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
