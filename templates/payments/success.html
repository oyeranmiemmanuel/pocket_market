{% extends 'core/base.html' %}

{% block title %}Payment Successful | Top Tech{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white rounded-xl shadow p-10 text-center">
        <div class="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-check text-3xl text-green-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment Successful</h1>
        <p class="text-gray-500">
            Your order <span class="text-indigo-600 font-semibold">{{ order.reference }}</span> has been confirmed.
        </p>
        <p class="text-gray-500 mt-1">Total paid: <span class="font-semibold text-gray-800">₦{{ order.total }}</span></p>
        <a href="{% url 'orders:order_detail' order.reference %}"
           class="inline-block mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition">
            View order
        </a>
    </div>
</div>
{% endblock %}
