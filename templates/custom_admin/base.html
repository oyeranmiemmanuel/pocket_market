{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'custom_admin/base.css' %}?v=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body>

<div class="admin-wrapper">

    <!-- Mobile backdrop - closes sidebar when tapped -->
    <div id="admin-sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside id="admin-sidebar">
        <div class="logo">MyApp Admin</div>
        <ul class="nav-menu">
            <li><a href="{% url 'admin_dashboard' %}" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="{% url 'admin_users' %}"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="{% url 'admin_products' %}"><i class="fas fa-box"></i> Products</a></li>
            <li><a href="{% url 'admin_orders' %}"><i class="fas fa-shopping-cart"></i> Orders</a></li>
            <li><a href="{% url 'admin_messages' %}">Messages</a></li>
            <li><a href="#"><i class="fas fa-chart-bar"></i> Analytics</a></li>
            <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <button id="admin-sidebar-toggle" type="button" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>Dashboard</h2>
            </div>
            <div>
                Welcome, <strong>{{ request.user.username }}</strong>
                <li>
    <form method="post" action="{% url 'custom_logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" style="width: 100%; text-align: left; background: none; border: none; color: #e74c3c; padding: 15px 25px; cursor: pointer;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </form>
</li>
            </div>
        </header>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script>
(function () {
    const sidebar = document.getElementById('admin-sidebar');
    const backdrop = document.getElementById('admin-sidebar-backdrop');
    const toggleBtn = document.getElementById('admin-sidebar-toggle');

    function closeSidebar() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('visible');
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('visible');
        });
    }

    if (backdrop) {
        backdrop.addEventListener('click', closeSidebar);
    }

    // Close automatically after tapping a nav link on mobile
    document.querySelectorAll('.nav-menu a').forEach(function (link) {
        link.addEventListener('click', closeSidebar);
    });
})();
</script>

</body>
</html>
